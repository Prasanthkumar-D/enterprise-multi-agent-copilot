[project]
name = "ai-transition"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Prasanthkumar-D", email = "prasanthvijay954@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.2",
    "google-genai>=3.0.0",
    "httpx>=0.28.1",
    "openai>=3.48.0",
    "pydantic>=2.14.3",
]

[project.scripts]
ai-transition = "ai_transition:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.4",
]

[tool.pyright]
typeCheckingMode = "strict"

[tool.ruff]
line-length = 88
